<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css?family=Acme&amp;display=swap" rel="stylesheet"> 
        <style>
    body {font-family: Acme;}
            
            /* Style the tab */
            .tab {
  overflow: hidden;
  border: 1px solid #ccc;
  background-color: #f1f1f1;
}

/* Style the buttons inside the tab */
.tab button {
  background-color: inherit;
  float: left;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  transition: 0.3s;
  font-size: 17px;
}

/* Change background color of buttons on hover */
.tab button:hover {
  background-color:moccasin;
}

/* Create an active/current tablink class */
.tab button.active {
  background-color:white;
}

/* Style the tab content */
.tabcontent {
  display: none;
  padding: 6px 12px;
  border: 1px solid:fdeeppink;
  border-top: none;
}
body {
    background-color: black;
    color: white;
}

h1 {
    font-family: Acme;
    font-size: 150px;
}

p {
    font-family: Monospace;
    font-size: 30px;
    margin: 15px;
    padding: 15px;
}
.insta {
font-family: Acme;
font-size: 40px;
}
</style>
</head>
<body>


<p>**** WORK IN PROGRESS ***:</p>


<div class="tab">
  <button class="tablinks" onclick="openCity(event, 'HOME')">HOME</button>
  <button class="tablinks" onclick="openCity(event, 'TAB')">TAB</button>
  <button class="tablinks" onclick="openCity(event, 'ABOUT US')">ABOUT US</button>
</div>

<div id="HOME" class="tabcontent">
    <p>*work in progress</p>
</div>

<div id="TAB" class="tabcontent">
    <p> TAB not yet decided</p> 
</div>

<div id="ABOUT US" class="tabcontent">
    <p>soon gonna fill up till then follow me on insta: </p>
    <p class="insta">@_.masterofnothing>_</p>
</div>
<h1 align="center">knight-byte</h1>

<script>
function openCity(evt, cityName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");
  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";
}
</script>
   

</body>
</html>
