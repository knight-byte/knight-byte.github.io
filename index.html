<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://fonts.googleapis.com/css?family=Acme&amp;display=swap" rel="stylesheet"> 
        <style>
          html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  display: table;
  background-color: black;
}

@font-face {
  font-family: neon;
  src: url(https://s3-us-west-2.amazonaws.com/s.cdpn.io/707108/neon.ttf);
}
.neoflux{
  text-align: center;
}
.container {
  display: table-cell;
  
  vertical-align: middle;
}

.neon {
  font-family: neon;
  text-align: center;
  color: #FB4264;
  font-size: 9vw;
  line-height: 9vw;
  text-shadow: 0 0 3vw #F40A35;
}

.flux {
  font-family: neon;
  color: #426DFB;
  font-size: 9vw;
  line-height: 9vw;
  text-shadow: 0 0 3vw #2356FF;
}

.neon {
  animation: neon 1s ease infinite;
  -moz-animation: neon 1s ease infinite;
  -webkit-animation: neon 1s ease infinite;
}

@keyframes neon {
  0%,
  100% {
    text-shadow: 0 0 1vw #FA1C16, 0 0 3vw #FA1C16, 0 0 10vw #FA1C16, 0 0 10vw #FA1C16, 0 0 .4vw #FED128, .5vw .5vw .1vw #806914;
    color: #FED128;
  }
  50% {
    text-shadow: 0 0 .5vw #800E0B, 0 0 1.5vw #800E0B, 0 0 5vw #800E0B, 0 0 5vw #800E0B, 0 0 .2vw #800E0B, .5vw .5vw .1vw #40340A;
    color: #806914;
  }
}

.flux {
  animation: flux 2s linear infinite;
  -moz-animation: flux 2s linear infinite;
  -webkit-animation: flux 2s linear infinite;
  -o-animation: flux 2s linear infinite;
}

@keyframes flux {
  0%,
  100% {
    text-shadow: 0 0 1vw #1041FF, 0 0 3vw #1041FF, 0 0 10vw #1041FF, 0 0 10vw #1041FF, 0 0 .4vw #8BFDFE, .5vw .5vw .1vw #147280;
    color: #28D7FE;
  }
  50% {
    text-shadow: 0 0 .5vw #082180, 0 0 1.5vw #082180, 0 0 5vw #082180, 0 0 5vw #082180, 0 0 .2vw #082180, .5vw .5vw .1vw #0A3940;
    color: #146C80;
  }
}

    body {font-family: Acme;}
            
            /* Style the tab */
            .tab {
  overflow: hidden;
  border: 1px solid #ccc;
  background-color: #f1f1f1;
}

/* Style the buttons inside the tab */
.tab button {
  background-color: inherit;
  float: left;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  transition: 0.3s;
  font-size: 17px;
}

/* Change background color of buttons on hover */
.tab button:hover {
  background-color:moccasin;
}

/* Create an active/current tablink class */
.tab button.active {
  background-color:rgba(255, 255, 255, 0.582);
}

/* Style the tab content */
.tabcontent {
  display: none;
  padding: 6px 12px;
  border: 1px solid deeppink;
  border-top: none;
}
body {
    background-color: black;
    color: white;
}

h1 {
    font-family: Acme;
    font-size: 150px;
}

p {
    font-family: Monospace;
    font-size: 30px;
    margin: 15px;
    padding: 15px;
}
.insta {
font-family: Acme;
font-size: 40px;
}
a:link {
  text-decoration: none;
  color: #ccc;
}

a:visited {
  text-decoration: none;
  color: #ccc;
}

a:hover {
  text-decoration: underline;
  color: #ccc;
}

a:active {
  text-decoration: underline;
  color: #ccc;
}
</style>
</head>
<body>


<p>**** WORK IN PROGRESS ***</p>


<div class="tab">
  <button class="tablinks" onclick="openCity(event, 'HOME')">HOME</button>
  <button class="tablinks" onclick="openCity(event, 'TAB')">TAB</button>
  <button class="tablinks" onclick="openCity(event, 'ABOUT US')">ABOUT US</button>
</div>

<div id="HOME" class="tabcontent">
    <p>* work in progress </p>
</div>

<div id="TAB" class="tabcontent">
    <p> TAB not yet Decided</p> 
</div>

<div id="ABOUT US" class="tabcontent">
    <p>soon gonna fill up till then follow me on insta:  <a class="insta" href="https://www.instagram.com/_.masterofnothing._/">@_.masterofnothing._</a> </p>
   
</div>

<p class="neon neoflux"><br>KNIGHT</p>
<p class="flux neoflux">BYTE</p>

<script>
function openCity(evt, cityName) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablinks");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].className = tablinks[i].className.replace(" active", "");

  }
  document.getElementById(cityName).style.display = "block";
  evt.currentTarget.className += " active";
}
</script>
   

</body>
</html>
